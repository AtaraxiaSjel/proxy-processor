[package]
name = "proxy-processor"
version = "0.1.1"
edition = "2024"

[dependencies]
base64 = "0.22.1"
dns-lookup = "2.1.0"
hickory-resolver = "0.25.2"
itertools = "0.14.0"
maxminddb = "0.26.0"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tracing = "0.1.41"
url = { version = "2.5.4", features = ["serde"] }
urlencoding = "2.1.3"

[dev-dependencies]
tracing-test = "0.2.5"

